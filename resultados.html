<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6e2435" />
  <!-- PANEL PRIVADO de los novios: no se enlaza desde el menú público
       y no debe indexarse. El acceso pide contraseña y, por debajo, se
       autentica de forma anónima en Firebase (lee rsvp, gestiona lugares). -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel · María & Alberto</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body class="subpage">

  <header class="subpage-header">
    <a class="subpage-header__brand" href="./index.html">María&nbsp;&amp;&nbsp;Alberto</a>
    <a class="subpage-header__back" href="./index.html">← Volver</a>
  </header>

  <main class="subpage-main">
    <section class="section section--results">
      <div class="floral-rule" aria-hidden="true">✿</div>
      <h1 class="section__title">Panel de los novios</h1>

      <!-- Puerta de acceso: contraseña -->
      <form id="results-gate" class="results-gate" novalidate>
        <label class="field">
          <span class="field__label">Contraseña</span>
          <input class="field__input" type="password" name="password"
                 autocomplete="current-password" placeholder="Solo para los novios" />
        </label>
        <button type="submit" class="btn btn--solid btn--block">Entrar</button>
      </form>
      <p id="results-feedback" class="form-feedback" role="status" aria-live="polite"></p>

      <!-- Panel con pestañas (las genera src/modules/panel.js) -->
      <div id="panel" class="panel" hidden>
        <button type="button" class="panel-salir" data-salir>Salir</button>
        <a class="panel-link" href="./invitados.html">Gestión de invitados
          <span class="panel-link__sub">lista completa, estados y regalos →</span></a>
        <nav id="panel-tabs" class="panel-tabs" role="tablist" aria-label="Secciones del panel"></nav>
        <div id="panel-view" class="panel-view"></div>
      </div>
    </section>
  </main>

  <footer class="subpage-footer">
    <p class="closing__names">María &amp; Alberto</p>
    <p class="closing__date">24 · 10 · 2026</p>
  </footer>

  <script type="module" src="/src/resultados.js"></script>
</body>
</html>

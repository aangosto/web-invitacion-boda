<body class="subpage">

  <!-- Cabecera simple de subpágina -->
  <header class="subpage-header">
    <a class="subpage-header__brand" href="./index.html">María&nbsp;&amp;&nbsp;Alberto</a>
    <a class="subpage-header__back" href="./index.html">← Volver</a>
  </header>

  <main class="subpage-main">
    <section class="section section--rsvp">
      <div class="floral-rule" aria-hidden="true">✿</div>
      <h1 class="section__title">Confirma tu asistencia</h1>

      <!-- =========================================================
           ASISTENTE POR PASOS (wizard). Cada pregunta es una pantalla;
           el contenido de cada paso se pinta desde JS (src/modules/rsvp.js)
           a partir del estado guardado en memoria + sessionStorage.
           ========================================================= -->
      <div id="wizard" class="wizard">

        <!-- Indicador de progreso -->
        <div class="wizard__progress" role="progressbar" aria-label="Progreso del cuestionario"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="wizard-bar" class="wizard__progress-bar"></div>
        </div>
        <p id="wizard-count" class="wizard__count">Paso 1</p>

        <!-- Pantalla del paso actual (contenido inyectado desde JS) -->
        <div id="wizard-screen" class="wizard__screen"></div>

        <!-- Mensajes de validación / estado -->
        <p id="wizard-feedback" class="form-feedback" role="status" aria-live="polite"></p>

        <!-- Navegación Atrás / Siguiente -->
        <div class="wizard__nav">
          <button type="button" id="wizard-back" class="btn btn--ghost wizard__back">← Atrás</button>
          <button type="button" id="wizard-next" class="btn btn--solid wizard__next">Siguiente →</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="subpage-footer">
    <p class="closing__names">María &amp; Alberto</p>
    <p class="closing__date">24 · 10 · 2026</p>
  </footer>

  <script type="module" src="/src/cuestionario.js"></script>
</body>
</html>

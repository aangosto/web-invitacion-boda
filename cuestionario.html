<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6e2435" />
  <meta name="description" content="Confirma tu asistencia · Boda de María & Alberto" />
  <meta name="robots" content="noindex" />
  <title>Confirmar asistencia · María & Alberto</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body class="subpage">

  <!-- Cabecera simple de subpágina -->
  <header class="subpage-header">
    <a class="subpage-header__brand" href="./index.html">María&nbsp;&amp;&nbsp;Alberto</a>
    <a class="subpage-header__back" href="./index.html">← Volver</a>
  </header>

  <main class="subpage-main">
    <section class="section section--rsvp">
      <div class="floral-rule reveal" aria-hidden="true">✿</div>
      <h1 class="section__title reveal">Confirma tu asistencia</h1>
      <p class="section__lead reveal">Agradeceríamos confirmación lo antes posible. Puedes
        confirmar por varias personas a la vez.</p>

      <form id="rsvp-form" class="rsvp-form reveal" novalidate>
        <label class="field">
          <span class="field__label">¿Quién rellena la confirmación?</span>
          <input class="field__input" type="text" name="filledBy" autocomplete="name" required placeholder="Tu nombre" />
        </label>

        <!-- Tarjetas de persona (se inyectan desde JS) -->
        <div id="people-list" class="people-list"></div>

        <button type="button" id="add-person" class="btn btn--ghost btn--block">+ Añadir persona</button>

        <button type="submit" class="btn btn--solid btn--block" id="rsvp-submit">Enviar confirmación</button>
        <p id="rsvp-feedback" class="form-feedback" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="subpage-footer">
    <p class="closing__names">María &amp; Alberto</p>
    <p class="closing__date">24 · 10 · 2026</p>
  </footer>

  <script type="module" src="/src/cuestionario.js"></script>
</body>
</html>
